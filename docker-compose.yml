version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: federico_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: federicodb
    ports:
      - "5430:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "federicodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: federico_backend
    environment:
      - NODE_ENV=development
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=federicodb
      - JWT_SECRET=super_secret_jwt_key_proto
      - PORT=3000
      - CORS_ORIGIN=https://federico-system-inventary.space
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: federico_frontend
    environment:
      - VITE_API_URL=https://federico_api.federico-system-inventary.space/api
      - VITE_N8N_URL=https://n8n.federico-system-inventary.space/webhook/3a65b478-ad7f-4cce-add5-11b0664116f2
    # Se remueve ports, Nginx los expondrá
    depends_on:
      - backend
    ports:
      - "8082:8080"
    volumes:
      - .:/app
      - /app/node_modules

  proxy:
    image: nginx:alpine
    container_name: federico_proxy
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
